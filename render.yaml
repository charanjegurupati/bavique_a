services:
  - type: web
    name: bavique-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_INITIAL_EMAIL
        value: admin@bavique.com
      - key: ADMIN_INITIAL_PASSWORD
        value: Bavique@Admin2026!
